openapi: 3.0.3
info:
  title: LastWeekOnEarth API
  description: >
    인맥관리 앱 (BLE 명함 교환 + 리멤버 스타일 관리) API 명세.
    현재 백엔드 라우트는 이 명세를 기준으로 한 스텁(501 Not Implemented)이며,
    기능별 구현이 진행되면서 각 엔드포인트가 실제 동작으로 교체됩니다.
    Source of truth는 backend/src/modules/**/*.routes.ts 이며, 이 문서는 그것과 동기화되어야 합니다.
  version: 0.1.0
servers:
  - url: http://localhost:4000/api
    description: Local dev

tags:
  - name: auth
  - name: contacts
  - name: groups
  - name: cv
  - name: mail-drafts
  - name: notifications

paths:
  /auth/check-username:
    post:
      tags: [auth]
      summary: 아이디 중복 확인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }

  /auth/check-email:
    post:
      tags: [auth]
      summary: 이메일 형식/중복 확인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  validFormat: { type: boolean }

  /auth/phone/send-otp:
    post:
      tags: [auth]
      summary: 휴대폰 OTP 발송
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: "010-1234-5678" }
      responses:
        "200": { description: OTP 발송 성공 }

  /auth/phone/verify-otp:
    post:
      tags: [auth]
      summary: 휴대폰 OTP 검증
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, otpCode]
              properties:
                phone: { type: string }
                otpCode: { type: string }
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified: { type: boolean }

  /auth/signup:
    post:
      tags: [auth]
      summary: 회원가입 (휴대폰 인증 완료 후)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, name, affiliation, email, phone]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                name: { type: string }
                affiliation: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
      responses:
        "201":
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /auth/login:
    post:
      tags: [auth]
      summary: 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"

  /auth/refresh:
    post:
      tags: [auth]
      summary: 액세스 토큰 재발급
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }

  /auth/logout:
    post:
      tags: [auth]
      summary: 로그아웃 (refreshToken 무효화)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "204": { description: 로그아웃 성공 }

  /contacts:
    get:
      tags: [contacts]
      summary: 내 주소록 목록 조회
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Contact" }
    post:
      tags: [contacts]
      summary: 인맥 수동 등록
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactCreateRequest"
      responses:
        "201":
          description: 생성 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }

  /contacts/{id}:
    parameters:
      - $ref: "#/components/parameters/ContactId"
    get:
      tags: [contacts]
      summary: 인맥 상세 조회
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
    patch:
      tags: [contacts]
      summary: 인맥 정보 수정
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactCreateRequest"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
    delete:
      tags: [contacts]
      summary: 인맥 삭제
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: 삭제 성공 }

  /contacts/ble-tag:
    post:
      tags: [contacts]
      summary: BLE로 수신한 상대 토큰으로 인맥 자동 등록 (CLAUDE.md 섹션 4)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: 상대 기기가 advertise한 5분 만료 단기 토큰
      responses:
        "201":
          description: 생성 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }

  /contacts/{id}/logs:
    parameters:
      - $ref: "#/components/parameters/ContactId"
    get:
      tags: [contacts]
      summary: 연락 이력 조회
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContactLog" }
    post:
      tags: [contacts]
      summary: 연락 이력 기록 (lastContactedAt 갱신)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { $ref: "#/components/schemas/LogChannel" }
                memo: { type: string }
      responses:
        "201":
          description: 생성 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactLog" }

  /groups:
    get:
      tags: [groups]
      summary: 연락 빈도 그룹 목록
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContactGroup" }
    post:
      tags: [groups]
      summary: 연락 빈도 그룹 생성
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, frequencyDays]
              properties:
                name: { type: string, example: "핵심 인맥" }
                frequencyDays: { type: integer, example: 30 }
      responses:
        "201":
          description: 생성 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactGroup" }

  /groups/{id}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [groups]
      summary: 그룹 상세 조회
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactGroup" }
    patch:
      tags: [groups]
      summary: 그룹 수정
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactGroup" }
    delete:
      tags: [groups]
      summary: 그룹 삭제
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: 삭제 성공 }

  /groups/{id}/members:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      tags: [groups]
      summary: 그룹에 인맥 추가
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contactId]
              properties:
                contactId: { type: string, format: uuid }
      responses:
        "204": { description: 추가 성공 }

  /groups/{id}/members/{contactId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - name: contactId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [groups]
      summary: 그룹에서 인맥 제거
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: 제거 성공 }

  /groups/{id}/overdue:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [groups]
      summary: 연락 주기 초과 인맥 조회 (알림 대상)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  overdueContacts:
                    type: array
                    items:
                      type: object
                      properties:
                        contactId: { type: string, format: uuid }
                        name: { type: string }
                        lastContactedAt: { type: string, format: date-time, nullable: true }
                        daysSince: { type: integer }

  /cv:
    get:
      tags: [cv]
      summary: CV 타임라인 조회
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CvEntry" }
    post:
      tags: [cv]
      summary: CV 항목 추가
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                source: { $ref: "#/components/schemas/CvSource" }
                entryDate: { type: string, format: date-time }
      responses:
        "201":
          description: 생성 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CvEntry" }

  /cv/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [cv]
      summary: CV 항목 수정
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CvEntry" }
    delete:
      tags: [cv]
      summary: CV 항목 삭제
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: 삭제 성공 }

  /mail-drafts/generate:
    post:
      tags: [mail-drafts]
      summary: AI 메일 초안 단건 생성
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contactId]
              properties:
                contactId: { type: string, format: uuid }
      responses:
        "201":
          description: 생성 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailDraft" }

  /mail-drafts/batch-generate:
    post:
      tags: [mail-drafts]
      summary: AI 메일 초안 그룹 단위 일괄 생성
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupId, label]
              properties:
                groupId: { type: string, format: uuid }
                label: { type: string, example: "2026 하반기 안부 메일" }
      responses:
        "201":
          description: 생성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  batchId: { type: string, format: uuid }
                  draftsCreated: { type: integer }

  /mail-drafts:
    get:
      tags: [mail-drafts]
      summary: 메일 초안 목록 조회
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EmailDraft" }

  /mail-drafts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [mail-drafts]
      summary: 메일 초안 상세 조회
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailDraft" }
    patch:
      tags: [mail-drafts]
      summary: 메일 초안 수정 (발송 전 편집)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailDraft" }

  /mail-drafts/{id}/send:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [mail-drafts]
      summary: 메일 초안 발송
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailDraft" }

  /notifications:
    get:
      tags: [notifications]
      summary: 내 알림 목록 조회
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }

  /notifications/{id}/read:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [notifications]
      summary: 알림 읽음 처리
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ContactId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    GroupId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        name: { type: string }
        affiliation: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        createdAt: { type: string, format: date-time }

    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }

    ContactSource:
      type: string
      enum: [MANUAL, BLE]

    LogChannel:
      type: string
      enum: [EMAIL, CALL, MEETING, OTHER]

    CvSource:
      type: string
      enum: [MANUAL, SOCIAL]

    DraftStatus:
      type: string
      enum: [DRAFT, SCHEDULED, SENT]

    ContactCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: "홍길동" }
        affiliation: { type: string, example: "OO회사 마케팅팀" }
        email: { type: string, format: email, example: "hong@example.com" }
        phone: { type: string, example: "010-1234-5678" }
        memo: { type: string, example: "26년 6월 컨퍼런스에서 만남" }

    Contact:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        affiliation: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        memo: { type: string, nullable: true }
        source: { $ref: "#/components/schemas/ContactSource" }
        lastContactedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    ContactLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        contactId: { type: string, format: uuid }
        channel: { $ref: "#/components/schemas/LogChannel" }
        memo: { type: string, nullable: true }
        contactedAt: { type: string, format: date-time }

    ContactGroup:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        frequencyDays: { type: integer }
        createdAt: { type: string, format: date-time }

    CvEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        content: { type: string }
        source: { $ref: "#/components/schemas/CvSource" }
        entryDate: { type: string, format: date-time }

    EmailDraft:
      type: object
      properties:
        id: { type: string, format: uuid }
        contactId: { type: string, format: uuid, nullable: true }
        batchId: { type: string, format: uuid, nullable: true }
        subject: { type: string }
        body: { type: string }
        status: { $ref: "#/components/schemas/DraftStatus" }
        scheduledAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        contactId: { type: string, format: uuid, nullable: true }
        groupId: { type: string, format: uuid, nullable: true }
        type: { type: string, enum: [CONTACT_REMINDER] }
        scheduledAt: { type: string, format: date-time }
        sent: { type: boolean }

    Error:
      type: object
      properties:
        error: { type: string }
