services:
  backend:
    build:
      context: ./backend
      network: host
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: file:/data/anchora.db
      NODE_ENV: production
    # Caddy가 유일한 외부 진입점이 되므로 호스트에 직접 포트를 열지 않는다
    # (Gmail OAuth가 https://172.10.7.202.nip.io를 통해서만 들어오게 강제).
    volumes:
      - backend-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # https://172.10.7.202.nip.io 로 들어오는 요청을 backend:4000으로 리버스 프록시하면서
  # Let's Encrypt 인증서를 자동으로 발급/갱신한다. Gmail의 gmail.send는 민감한 스코프라
  # 구글이 OAuth redirect_uri에 https://를 요구하기 때문에 필요해졌다 (backend/.env의
  # GOOGLE_OAUTH_REDIRECT_URI 참고). ACME 인증을 위해 80/443이 외부에서 열려있어야 한다.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config

volumes:
  backend-data:
  caddy-data:
  caddy-config:
