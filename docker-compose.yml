services:
  backend:
    build:
      context: ./backend
      network: host
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: file:/data/anchora.db
      NODE_ENV: production
    # cloudflared가 유일한 외부 진입점이 되므로 호스트에 직접 포트를 열지 않는다.
    volumes:
      - backend-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # KAIST 캠퍼스 네트워크가 인바운드/아웃바운드 임의 접속을 막고 있어 Let's Encrypt(Caddy)의
  # ACME 검증(80/443 인바운드 필요)이 실패한다. cloudflared는 반대로 VM -> Cloudflare
  # 아웃바운드 연결만 필요해서 이 제약을 우회할 수 있다. Quick Tunnel이라 매번 랜덤
  # https://xxxx.trycloudflare.com 주소를 받는다 (재시작 전까진 고정).
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - backend
    command: tunnel --no-autoupdate --url http://backend:4000

volumes:
  backend-data:
