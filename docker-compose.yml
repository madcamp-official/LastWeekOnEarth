services:
  backend:
    build:
      context: ./backend
      network: host
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: file:/data/anchora.db
      NODE_ENV: production
    ports:
      - "4000:4000"
    volumes:
      - backend-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  backend-data:
